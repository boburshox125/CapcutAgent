name: Build exe
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: >
          pyinstaller --onefile --console --name CapCutAgent
          --collect-all mcp --collect-submodules pyautogui --collect-all pygetwindow
          --exclude-module mouseinfo --exclude-module tkinter --hidden-import pyperclip --hidden-import mss.windows
          capcut_agent/launcher.py
      - uses: actions/upload-artifact@v4
        with:
          name: CapCutAgent
          path: dist/CapCutAgent.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CapCutAgent.exe
